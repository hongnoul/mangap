version: 2

project_name: mangap

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X 'github.com/hongnoul/mangap/constant.Version={{ .Version }}'
      - -X 'github.com/hongnoul/mangap/constant.BuiltAt={{ .Date }}'
      - -X 'github.com/hongnoul/mangap/constant.BuiltBy=goreleaser'
      - -X 'github.com/hongnoul/mangap/constant.Revision={{ .ShortCommit }}'
      - -s
      - -w

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - completions/*
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test"
      - "^chore"
      - "^docs"
      - Merge pull request
      - Merge branch

# brew install hongnoul/tap/mangap
# Needs the TAP_PAT secret (a token with push access to hongnoul/homebrew-tap).
# The release workflow sets TAP_PAT to "" when the secret is missing, and
# skip_upload then skips the tap push so releases still go out.
brews:
  - name: mangap
    skip_upload: '{{ if .Env.TAP_PAT }}false{{ else }}true{{ end }}'
    repository:
      owner: hongnoul
      name: homebrew-tap
      token: "{{ .Env.TAP_PAT }}"
    directory: Formula
    homepage: https://github.com/hongnoul/mangap
    description: Read manga in your terminal with real images (kitty graphics)
    license: MIT
    commit_author:
      name: goreleaser
      email: bot@goreleaser.com
    commit_msg_template: "mangap {{ .Tag }}"
    install: |
      bin.install "mangap"
      bash_completion.install "completions/mangap.bash" => "mangap"
      zsh_completion.install "completions/mangap.zsh" => "_mangap"
      fish_completion.install "completions/mangap.fish"
    test: |
      assert_match version.to_s, shell_output("#{bin}/mangap version --short")

release:
  github:
    owner: hongnoul
    name: mangap
  name_template: "{{.ProjectName}} v{{.Version}}"
