project_name: mangap

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -X 'github.com/hongnoul/mangap/constant.BuiltAt={{ .Date }}'
      - -X 'github.com/hongnoul/mangap/constant.BuiltBy={{ .Env.USER }}'
      - -X 'github.com/hongnoul/mangap/constant.Revision={{ .ShortCommit }}'
      - -s
      - -w

archives:
  - format_overrides:
      - goos: windows
        format: zip
    files:
      - completions/*
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test'
      - '^chore'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: hongnoul
    name: mangap
  name_template: "{{.ProjectName}} v{{.Version}}"
